---
- name: Restart HAProxy
  community.docker.docker_compose_v2:
    project_name: "{{ app_name }}"
    definition: "{{ lookup('template', 'docker-compose.yaml.j2') | from_yaml }}"
    services:
      - lb
    state: restarted

- name: Restart Nginx
  community.docker.docker_compose_v2:
    project_name: "{{ app_name }}"
    definition: "{{ lookup('template', 'docker-compose.yaml.j2') | from_yaml }}"
    services:
      - statics
    state: restarted