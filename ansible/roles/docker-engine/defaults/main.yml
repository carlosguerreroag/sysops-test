---
apt_keyrings_dir: "/etc/apt/keyrings"
apt_default_cache_valid_time: 3600

docker_users:
  - vagrant

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_repo_apt_url: "https://download.docker.com/linux/ubuntu"
docker_repo_gpg_key_url: "https://download.docker.com/linux/ubuntu/gpg"